name: Create Test Data in SQL

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User ID for account creation"
        required: false
        default: "71"
      account_type:
        description: "Type of account"
        required: false
        default: "Individual Savings"
      num_accounts:
        description: "Number of accounts to create"
        required: false
        default: "10"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      - name: Execute Python Script
        id: create_accounts
        run: |
          python .github/workflows/main.py \
            --user_id ${{ github.event.inputs.user_id }} \
            --account_type "${{ github.event.inputs.account_type }}" \
            --num_accounts ${{ github.event.inputs.num_accounts }}

      - name: Output Created IDs
        run: |
          echo "The following IDs were created: ${{ steps.create_accounts.outputs.created_ids }}"